name: Discord commits

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post commits to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          COMPARE_URL: ${{ github.event.compare }}
          PUSHER: ${{ github.actor }}
          PUSHER_URL: ${{ github.server_url }}/${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "Secret DISCORD_WEBHOOK is not set."
            echo "GitHub → Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: DISCORD_WEBHOOK  Value: Discord webhook URL"
            exit 1
          fi

          if ! jq -e '.commits | type == "array" and length > 0' "${GITHUB_EVENT_PATH}" >/dev/null; then
            echo "No commits in push payload — skip."
            exit 0
          fi

          COUNT="$(jq '.commits | length' "${GITHUB_EVENT_PATH}")"

          # Один embed на коммит (макс. 10 на сообщение Discord).
          PAYLOAD="$(
            jq -nc \
              --arg branch "${BRANCH_NAME}" \
              --arg repo "${REPO}" \
              --arg repo_url "${REPO_URL}" \
              --arg compare "${COMPARE_URL}" \
              --arg pusher "${PUSHER}" \
              --arg pusher_url "${PUSHER_URL}" \
              --slurpfile event "${GITHUB_EVENT_PATH}" '
              ($event[0].commits | .[0:10]) as $commits
              | ($commits | length) as $n
              | {
                  username: "Anti-Cheat Updates",
                  avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                  content: (
                    "**Новый пуш** в [`" + $repo + "`](" + $repo_url + ")\n"
                    + "Ветка: `" + $branch + "` · Автор пуша: [" + $pusher + "](" + $pusher_url + ")"
                    + (if $compare != "" then " · [Сравнить изменения](" + $compare + ")" else "" end)
                    + (if ($event[0].commits | length) > 10
                       then "\n_Показаны первые 10 из " + (($event[0].commits | length) | tostring) + " коммитов._"
                       else "" end)
                  ),
                  embeds: [
                    $commits[] | {
                      title: (
                        ((.message | split("\n")[0])[0:200])
                        | if length == 0 then "(без сообщения)" else . end
                      ),
                      url: .url,
                      description: (
                        (
                          (.message | split("\n")[1:] | map(select(length > 0)) | join("\n"))
                          | if length > 0 then .[0:800] + "\n\n" else "" end
                        )
                        + "**Коммит**\n"
                        + "`" + .id[0:7] + "` · [открыть на GitHub](" + .url + ")\n\n"
                        + "**Кто**\n"
                        + .author.name
                        + (if (.author.username // "") != "" then " (`" + .author.username + "`)" else "" end)
                        + "\n\n"
                        + "**Куда**\n"
                        + "`" + $repo + "` → ветка `" + $branch + "`\n\n"
                        + "**Когда**\n"
                        + (.timestamp // "unknown")
                      ),
                      color: 5793266,
                      author: (
                        { name: .author.name }
                        + (
                          if (.author.username // "") != "" then {
                            url: ("https://github.com/" + .author.username),
                            icon_url: ("https://github.com/" + .author.username + ".png?size=64")
                          } else {} end
                        )
                      ),
                      footer: {
                        text: ($repo + " · " + $branch + " · " + .id[0:7])
                      },
                      timestamp: (.timestamp // null)
                    }
                  ]
                }
              '
          )"

          curl --fail-with-body -sS \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${DISCORD_WEBHOOK}"

          echo
          echo "Discord notify OK (${COUNT} commit(s) on ${BRANCH_NAME})."
